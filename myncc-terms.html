<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1630">
<title>Terms and Conditions – My NCC (com.signature.x.myncc)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1630;--navy3:#14295a;--gold:#e6c46f;--gold2:#c49a3a;--saf:#ff9933;--grn:#138808;--ink:#eef1f8;--mute:#a9b4cc;--line:rgba(230,196,111,.18);color-scheme:dark;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Noto Sans Devanagari",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.85;font-size:16px;background:linear-gradient(180deg,#0a1630 0%,#07101f 100%);overflow-x:hidden;overflow-wrap:anywhere}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(80px);opacity:.26;animation:drift 24s ease-in-out infinite alternate;will-change:transform}
.aurora i:nth-child(1){background:var(--saf);top:-24vmax;left:-22vmax}
.aurora i:nth-child(2){background:#2147b8;top:18vmax;right:-30vmax;animation-delay:-9s;opacity:.32}
.aurora i:nth-child(3){background:var(--grn);bottom:-28vmax;left:-12vmax;animation-delay:-15s;opacity:.22}
@keyframes drift{to{transform:translate(9vmax,6vmax) scale(1.18)}}
.flag{position:fixed;top:0;left:0;right:0;height:4px;z-index:60;background:linear-gradient(90deg,#ff9933 0 33.34%,#fff 33.34% 66.67%,#138808 66.67%)}
.prog{position:fixed;top:4px;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,var(--gold2),#fff3c7,var(--gold));transform:scaleX(0);transform-origin:left}
.hero{text-align:center;padding:calc(64px + env(safe-area-inset-top,0px)) 18px 60px;position:relative}
.sealw{position:relative;width:124px;height:124px;margin:0 auto 24px}
.ring{position:absolute;inset:0;border-radius:30px;border:2px solid var(--gold);animation:ping 3.2s ease-out infinite}
.ring.r2{animation-delay:1.6s}
@keyframes ping{0%{transform:scale(.95);opacity:.65}100%{transform:scale(1.55);opacity:0}}
.seal{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,var(--navy3),var(--navy));box-shadow:0 20px 50px rgba(230,196,111,.30),0 0 0 1px rgba(230,196,111,.3);animation:float 5s ease-in-out infinite}
.seal img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes float{50%{transform:translateY(-8px)}}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(230,196,111,.06)}
h1{margin:0 auto;max-width:860px;font-size:clamp(24px,5.2vw,40px);font-weight:700;line-height:1.4;background:linear-gradient(100deg,#fff 0%,#ffe9a8 30%,#fff 55%,#ffe9a8 80%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.tri{position:relative;height:5px;width:min(340px,72%);margin:26px auto 0;border-radius:6px;overflow:hidden;background:linear-gradient(90deg,#ff9933 0 33.34%,#fff 33.34% 66.67%,#138808 66.67%)}
.tri::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:sweep 3.4s ease-in-out infinite}
@keyframes sweep{to{left:120%}}
.wrap{max-width:1200px;margin:0 auto;padding:10px 18px 56px}
.intro{padding:22px 24px;margin-bottom:28px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:0 18px 44px rgba(0,0,0,.35)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:0;padding:0;list-style:none}
.meta li{font-size:12.5px;color:var(--mute);opacity:0;animation:rise .8s ease forwards}
.meta li:nth-child(2){animation-delay:.12s}.meta li:nth-child(3){animation-delay:.24s}.meta li:nth-child(4){animation-delay:.36s}.meta li:nth-child(5){animation-delay:.48s}
.meta b{display:block;margin-top:2px;color:var(--gold);font-size:16px;line-height:1.5}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}
.layout>*{min-width:0}
nav{position:sticky;top:20px;padding:16px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-height:calc(100vh - 40px);overflow:auto}
nav summary{font-weight:700;cursor:pointer;list-style:none;color:var(--gold);display:flex;align-items:center;justify-content:space-between}
nav summary::-webkit-details-marker{display:none}
nav summary::after{content:"▾";transition:transform .3s}
nav details[open] summary::after{transform:rotate(180deg)}
nav ol{margin:12px 0 0;padding:0;list-style:none}
nav a{display:block;padding:7px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-size:13.5px;line-height:1.55;border-left:2px solid transparent;transition:all .25s}
nav a:hover{background:rgba(230,196,111,.08);color:var(--gold)}
nav a.act{color:#fff;background:linear-gradient(90deg,rgba(255,153,51,.18),rgba(19,136,8,.12));border-left-color:var(--saf)}
main{min-width:0}
section{position:relative;padding:28px 28px 22px 32px;margin-bottom:20px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.04);box-shadow:0 12px 34px rgba(0,0,0,.28);transition:border-color .3s,box-shadow .3s}
section::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:4px;border-radius:4px;background:linear-gradient(180deg,#ff9933 0 33%,#fff 33% 66%,#138808 66%)}
section:hover{border-color:rgba(230,196,111,.38);box-shadow:0 16px 44px rgba(0,0,0,.4)}
.js section{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease,border-color .3s,box-shadow .3s}
.js section.in{opacity:1;transform:none}
h2{margin:0 0 16px;font-size:19px;line-height:1.55;display:flex;align-items:flex-start;gap:14px;font-weight:700}
h2 span:last-child{min-width:0}
h2 .n{flex:none;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(230,196,111,.3)}
h3{margin:26px 0 10px;font-size:16.5px;line-height:1.6;color:var(--gold);padding:4px 0 4px 14px;border-left:3px solid var(--saf);background:linear-gradient(90deg,rgba(255,153,51,.10),transparent)}
h4{margin:20px 0 8px;font-size:15.5px;color:#fff;line-height:1.6}
p{margin:0 0 12px;color:#d6dcec}
b{color:#fff}
ul.l{margin:0 0 14px;padding-left:22px}
ul.l li{margin-bottom:10px;color:#d6dcec}
ul.l li::marker{color:var(--saf)}
ul.l ul{margin:8px 0 4px;padding-left:20px}
ul.l ul li::marker{color:var(--grn)}
.chip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--gold);background:rgba(230,196,111,.09);border:1px solid rgba(230,196,111,.22);padding:2px 8px;border-radius:6px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0 16px;border-radius:16px;border:1px solid var(--line);max-width:100%}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:14.5px;overflow-wrap:normal}
th{background:linear-gradient(135deg,rgba(255,153,51,.22),rgba(230,196,111,.12));color:var(--gold);text-align:left;padding:12px;font-weight:700}
td{padding:12px;border-top:1px solid rgba(255,255,255,.07);color:#d6dcec;vertical-align:top}
tr:nth-child(even) td{background:rgba(255,255,255,.025)}
tbody tr{transition:background .2s}tbody tr:hover td{background:rgba(230,196,111,.07)}
a.lnk{color:var(--gold);font-weight:600;text-decoration:underline;text-decoration-color:rgba(230,196,111,.4);text-underline-offset:3px}
footer{text-align:center;color:var(--mute);font-size:14px;margin-top:34px;padding-top:26px}
footer .tri{margin:0 auto 20px}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;font-size:20px;font-weight:800;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(12px);transition:all .3s;z-index:50;box-shadow:0 10px 24px rgba(0,0,0,.4)}
#top.show{opacity:1;pointer-events:auto;transform:none}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr);gap:18px}nav{position:static;max-height:none}.wrap{padding:6px 14px 48px}section{padding:22px 18px 16px 22px;border-radius:18px}h2{font-size:17px;gap:12px}h2 .n{width:34px;height:34px}.intro{padding:18px}.hero{padding-top:calc(58px + env(safe-area-inset-top,0px))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js section{opacity:1;transform:none}.meta li{opacity:1}}

html[data-lang="en"] .hi{display:none!important}html[data-lang="hi"] .en{display:none!important}
.lang{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:70;display:flex;padding:4px;border-radius:999px;background:rgba(10,22,48,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.lang button{border:0;background:transparent;color:var(--mute);font:600 13px Inter,"Noto Sans Devanagari",sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405}
.crit,.consent{position:relative;margin:0 0 22px;padding:24px 24px 20px 30px;border-radius:22px;border:1px solid rgba(230,196,111,.5);background:linear-gradient(135deg,rgba(230,196,111,.16),rgba(230,196,111,.04));box-shadow:0 18px 44px rgba(0,0,0,.35)}
.crit::before,.consent::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:4px;border-radius:4px;background:linear-gradient(180deg,#ff9933 0 33%,#fff 33% 66%,#138808 66%)}
.crit h3,.consent h3{margin:0 0 10px;border:0;background:none;padding:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.crit p,.consent p{margin:0 0 10px;color:#f4efe0}
.note{padding:14px 16px;border-left:4px solid var(--saf);background:rgba(255,153,51,.1);border-radius:10px;margin:0 0 14px;font-weight:700;color:#ffe9c4}
ol.l{margin:0 0 14px;padding-left:24px}ol.l li{margin-bottom:10px;color:#d6dcec}ol.l li::marker{color:var(--saf);font-weight:700}
.meta a{color:var(--gold)}

.warn{padding:16px 18px;border-radius:16px;border-left:4px solid var(--saf);background:rgba(255,153,51,.1);margin:12px 0}
.warn p{margin:0;color:#ffe9c4}
.box{padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(230,196,111,.07);margin:12px 0}
.box p{margin:0 0 6px}
</style>
</head>
